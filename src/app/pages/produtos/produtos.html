
<section class="produtos-container">

  <header class="produtos-cabecalho">
    <h1>Nossos Produtos</h1>
    <p class="subtitulo">
      Cuide de você com nossos produtos especiais.
    </p>
  </header>

  <p *ngIf="carregando" class="mensagem">
    Carregando produtos...
  </p>

  <p *ngIf="erro" class="mensagem erro">
    {{ erro }}
  </p>

  <p *ngIf="mensagem" class="mensagem sucesso">
    {{ mensagem }}
  </p>

  <div class="produtos-grid" *ngIf="!carregando && !erro">

    <article class="produto-card" *ngFor="let produto of produtos">

      <div class="produto-info">
        <h2>{{ obterNome(produto) }}</h2>

        <p>{{ obterDescricao(produto) }}</p>

        <span class="produto-unidade">
          Unidade: {{ obterUnidade(produto) }}
        </span>

        <p class="produto-preco">
          {{ obterPreco(produto) | currency:'BRL':'symbol':'1.2-2' }}
        </p>

        <button
          type="button"
          (click)="adicionarAoCarrinho(produto)">
          Adicionar ao carrinho
        </button>
      </div>

    </article>

  </div>

  <p
    *ngIf="!carregando && !erro && produtos.length === 0"
    class="mensagem">
    Nenhum produto encontrado.
  </p>

</section>
