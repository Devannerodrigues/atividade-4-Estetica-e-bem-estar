
<section class="formulario-container">
  <form class="formulario-card" (ngSubmit)="entrar()">
    <h1>Entrar na minha conta</h1>
    <p>Acesse sua conta Estética Bem-Estar.</p>

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        autocomplete="email"
      />
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        [(ngModel)]="senha"
        required
        autocomplete="current-password"
      />
    </div>

    <p *ngIf="erro" class="mensagem-erro" role="alert">
      {{ erro }}
    </p>

    <button type="submit" class="botao-principal">
      Entrar
    </button>

    <p class="link-conta">
      Ainda não possui cadastro?
      <a routerLink="/cliente/cadastro">Criar conta</a>
    </p>
  </form>
</section>
