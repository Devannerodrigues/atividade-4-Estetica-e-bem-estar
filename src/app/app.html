
<header class="cabecalho">
  <a class="marca" routerLink="/">
    <span class="simbolo">✿</span>
    <span>
      <strong>Estética & Bem-Estar</strong>
      <small>Seu cuidado, nosso carinho</small>
    </span>
  </a>
<img
  src="assets/img/logo-estetica.png"
  alt="Estética & Bem-Estar"
  class="logo-site"
>
  <nav class="menu">
    <a routerLink="/" routerLinkActive="ativo"
       [routerLinkActiveOptions]="{ exact: true }">Início</a>
    <a routerLink="/produtos" routerLinkActive="ativo">Produtos</a>
    <a routerLink="/servicos" routerLinkActive="ativo">Serviços</a>
    <a routerLink="/agendamento" routerLinkActive="ativo">Agendamento</a>
<a routerLink="/carrinho" routerLinkActive="ativo">Carrinho</a>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="rodape">
  <p>Estética & Bem-Estar — Cuidar de você é nossa essência.</p>
</footer>
