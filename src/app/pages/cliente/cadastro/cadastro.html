
<section class="formulario-container">

  <form
    class="formulario-card"
    (ngSubmit)="cadastrar()"
    #formCadastro="ngForm">

    <h1>Crie sua conta</h1>

    <p class="subtitulo">
      Faça seu cadastro na Estética Bem-Estar.
    </p>

    <!-- NOME -->
    <div class="campo">
      <label for="nome">Nome completo *</label>

      <input
        id="nome"
        name="nome"
        type="text"
        [(ngModel)]="nome"
        required
        minlength="3"
        autocomplete="name"
        placeholder="Digite seu nome completo">
    </div>

    <!-- CPF -->
    <div class="campo">
      <label for="cpf">CPF *</label>

      <input
        id="cpf"
        name="cpf"
        type="text"
        [(ngModel)]="cpf"
        required
        maxlength="14"
        placeholder="000.000.000-00">
    </div>

    <!-- E-MAIL -->
    <div class="campo">
      <label for="email">E-mail *</label>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        email
        autocomplete="email"
        placeholder="seuemail@exemplo.com">
    </div>

    <!-- TELEFONE -->
    <div class="campo">
      <label for="telefone">Telefone *</label>

      <input
        id="telefone"
        name="telefone"
        type="tel"
        [(ngModel)]="telefone"
        required
        maxlength="15"
        autocomplete="tel"
        placeholder="(00) 00000-0000">
    </div>

    <!-- ENDEREÇO -->
    <div class="campo">
      <label for="endereco">Endereço completo *</label>

      <input
        id="endereco"
        name="endereco"
        type="text"
        [(ngModel)]="endereco"
        required
        autocomplete="street-address"
        placeholder="Rua, número, bairro e cidade">
    </div>

    <!-- SENHA -->
    <div class="campo">
      <label for="senha">Senha *</label>

      <input
        id="senha"
        name="senha"
        type="password"
        [(ngModel)]="senha"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="Mínimo de 8 caracteres">
    </div>

    <!-- CONFIRMAR SENHA -->
    <div class="campo">
      <label for="confirmarSenha">Confirme sua senha *</label>

      <input
        id="confirmarSenha"
        name="confirmarSenha"
        type="password"
        [(ngModel)]="confirmarSenha"
        required
        autocomplete="new-password"
        placeholder="Digite sua senha novamente">
    </div>

    <!-- ERRO -->
    <p
      *ngIf="erro"
      class="mensagem-erro"
      role="alert">

      {{ erro }}

    </p>

    <!-- BOTÃO -->
    <button
      type="submit"
      class="botao-principal">

      Cadastrar

    </button>

    <p class="link-conta">
      Já possui uma conta?
      <a routerLink="/cliente/login">Entrar</a>
    </p>

  </form>

</section>
